spring:
  jpa:
    database: postgresql
    show-sql: false
    hibernate:
      ddl-auto: update
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/db_students_frv}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:unam}
  application:
    name: appfrv-students
